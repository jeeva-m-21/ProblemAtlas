services:
  postgres:
    image: postgres:16-alpine
    container_name: problem-atlas-db
    environment:
      POSTGRES_USER: problem_atlas
      POSTGRES_PASSWORD: problem_atlas_dev
      POSTGRES_DB: problem_atlas
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U problem_atlas -d problem_atlas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
